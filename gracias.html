<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gracias por escribirnos | Abernor</title>

  <!-- Fuente igual a la landing -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --color-primary: #b11426;
      --color-black: #0b0b0b;
      --color-white: #f5f5f5;
      --color-border: rgba(255, 255, 255, 0.08);
      --shadow-soft: 0 20px 60px rgba(0, 0, 0, 0.35);
      --radius-lg: 24px;
      --transition: 0.3s ease;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--color-black);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .thankyou-container {
      width: min(92%, 520px);
      text-align: center;
      padding: 40px 32px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      background:
        linear-gradient(135deg, rgba(177, 20, 38, 0.12), rgba(255, 255, 255, 0.02)),
        #121212;
      box-shadow: var(--shadow-soft);
    }

    .logo-link {
      display: inline-block;
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .logo-link:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .logo {
      max-width: 180px;
      width: 100%;
      height: auto;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 28px;
      color: rgba(245, 245, 245, 0.75);
      font-size: 1rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      background: linear-gradient(135deg, var(--color-primary), #cf2037);
      color: white;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: 0 16px 40px rgba(177, 20, 38, 0.25);
    }

    .btn-home:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }
  </style>
</head>

<body>

  <div class="thankyou-container">

    <!-- LOGO (clickeable) -->
    <a href="index.html" class="logo-link">
      <img
        src="./Media/Logos/Abernor Rectangulo.png"
        alt="Abernor"
        class="logo"
      />
    </a>

    <!-- MENSAJE -->
    <h1>Gracias por escribirnos!</h1>

    <p>
      Recibimos tu mensaje correctamente.  
      En breve nos pondremos en contacto para analizar tu proyecto.
    </p>

    <!-- BOTÓN -->
    <a href="index.html" class="btn-home">
      Página principal
    </a>

  </div>

</body>
</html>
